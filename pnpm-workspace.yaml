# semantic-release resolves its plugins by name from the process cwd, so the
# whole `@semantic-release/*` chain has to be hoisted out of the pnpm store.
publicHoistPattern:
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*prettier*'
  - '*semantic-release*'

packages:
  - playground

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  node-pty: false
  unrs-resolver: true

patchedDependencies:
  conventional-changelog-gitmoji-config@1.5.2: patches/conventional-changelog-gitmoji-config@1.5.2.patch

minimumReleaseAgeExclude:
  - '@lobehub/commitlint-config@2.1.6'
  - '@lobehub/eslint-config@2.1.6'
  - '@lobehub/lint@2.1.6'
  - '@lobehub/prettier-config@2.1.6'
  - '@lobehub/remarklint-config@2.1.6'
  - '@lobehub/semantic-release-config@2.1.6'
  - '@lobehub/stylelint-config@2.1.6'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
